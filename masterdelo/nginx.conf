events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    client_max_body_size 15M;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout    30s;
    send_timeout         30s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=1r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    server {
        listen 80;

        limit_conn conn_limit 20;

        root  /usr/share/nginx/html;
        index index.html;

        # === Frontend ===
        location / {
            limit_req zone=static burst=50 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # === API — общий лимит ===
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            add_header X-Frame-Options          "DENY"                         always;
            add_header X-Content-Type-Options   "nosniff"                      always;
            add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        }

        # === Auth — жёсткий лимит ===
        location /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/register {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # === Загрузка фото ===
        location ~ ^/api/orders/[^/]+/photos$ {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 15M;
            proxy_pass http://backend:8000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # === PDF — жёсткий лимит ===
        location /api/pdf/ {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # === Статика (фото заказов) ===
        location /static/uploads/ {
            limit_req zone=static burst=30 nodelay;
            alias /usr/share/nginx/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Content-Security-Policy "default-src 'none'" always;

            limit_except GET {
                deny all;
            }
        }

        # === Swagger — закрыт в prod (FastAPI сам отдаёт 404, nginx дублирует) ===
        location ~ ^/(docs|redoc|openapi\.json) {
            deny all;
            return 404;
        }

        # === Блокировка типичных сканеров ===
        location ~* \.(php|asp|aspx|jsp|cgi|env|git|htaccess|htpasswd)$ {
            deny all;
            return 404;
        }

        # === Path traversal ===
        if ($request_uri ~* "\.\.") {
            return 400;
        }
    }
}
