version: "3.9"
services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - uploads_data:/app/static/uploads
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend

volumes:
  uploads_data:
